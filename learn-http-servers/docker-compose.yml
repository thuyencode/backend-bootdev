services:
  db:
    container_name: learn-http-servers_db
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: bootdev
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    container_name: learn-http-servers_app
    build:
      context: .
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
    driver: local
